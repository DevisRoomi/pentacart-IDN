name: Migrate production database

on:
  workflow_dispatch:
    inputs:
      import_public_listings:
        description: Import the unclaimed student listings and QRIS images
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_URL: ${{ secrets.PRODUCTION_DB_URL }}
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: gd, pdo_pgsql
          coverage: none
      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist
      - name: Run pending migrations
        run: php artisan migrate --force
      - name: Import public listings and QRIS images
        if: ${{ inputs.import_public_listings }}
        run: php artisan merchants:import-public --force
